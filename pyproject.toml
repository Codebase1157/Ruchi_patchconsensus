[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "patchconsensus"
version = "1.0.0"
description = "Dual-Axis Query Consensus Fusion of Heterogeneous Foundation Encoders for Artifact-Free Patch-Based Skin Lesion Segmentation"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    { name = "PatchConsensus Authors" },
]
keywords = [
    "consensus-admm", "encoder-only-segmentation", "foundation-models",
    "information-fusion", "patch-based-segmentation", "skin-lesion-segmentation",
    "vision-transformer-artifacts",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
train = [
    "torch>=2.2",
    "torchvision>=0.17",
    "timm>=1.0.9",
    "einops>=0.7",
    "pillow>=10.0",
    "opencv-python-headless>=4.9",
    "scikit-image>=0.22",
    "scikit-learn>=1.3",
    "tqdm>=4.66",
    "tensorboard>=2.15",
    "pandas>=2.0",
]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
pc-validate-theory      = "experiments.validate_theory:main"
pc-validate-noise-model = "experiments.noise_model_validation:main"
pc-smoke-test           = "experiments.smoke_test:main"

[tool.setuptools]
packages = ["patchconsensus", "patchconsensus.encoders", "patchconsensus.data", "patchconsensus.utils"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
